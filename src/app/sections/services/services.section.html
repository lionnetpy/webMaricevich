<section class="section section--paper" id="servicios">
    <div class="container">
        <div class="section-heading reveal">
            <div>
                <p class="eyebrow eyebrow--dark">{{ heading.eyebrow }}</p>
                <h2>{{ heading.title }}<br><em>{{ heading.highlight }}</em></h2>
            </div>
            <p class="section-lead">{{ heading.lead }}</p>
        </div>

        <div class="services-grid grid">
            @for (service of services; track service.number) {
                <article class="service-card reveal">
                    <span class="service-number">{{ service.number }}</span>
                    <span class="service-icon"><i [class]="'pi ' + service.icon" aria-hidden="true"></i></span>
                    <h3>{{ service.title }}</h3>
                    <p>{{ service.description }}</p>
                    <a class="text-link" [href]="service.link">{{ service.linkLabel }} <span aria-hidden="true">↗</span></a>
                </article>
            }
        </div>
    </div>
</section>
